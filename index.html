<style>
:root{--red:#a20f3c;--pink:#fff0f4;--line:#eddee3;--ink:#292126;--muted:#75666c}*{box-sizing:border-box}body{margin:0;background:#f9f6f7;color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:20px 14px calc(195px + env(safe-area-inset-bottom))}main{max-width:520px;margin:auto}header{text-align:center;padding:26px 20px 20px;background:white;border-radius:24px;border:1px solid var(--line)}header img{width:160px;max-width:65%;display:block;margin:0 auto 10px}header .brand{font-size:12px;letter-spacing:.08em;color:var(--muted)}h1{font-size:23px;letter-spacing:-1px;margin:12px 0 5px}p{margin:5px 0;color:var(--muted);font-size:13px;word-break:keep-all}fieldset,.summary{background:white;border:1px solid var(--line);border-radius:18px;padding:15px;margin:14px 0;min-width:0}h2{font-size:16px;letter-spacing:-.4px;margin:0 0 4px}h2 span{color:var(--red);font-size:12px;margin-right:8px}.hint{font-size:12px;margin:0 0 12px}.opt{position:relative;display:flex;align-items:center;gap:10px;padding:13px 11px;min-height:54px;border:1px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer}.opt:has(input:checked){background:var(--pink);border-color:#bb4264}.opt:focus-within{outline:2px solid #ad2e53;outline-offset:2px}.opt input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--red)}.opt .name{flex:1;min-width:0;word-break:keep-all;font-weight:600}.price{white-space:nowrap;color:var(--red);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}fieldset[disabled]{opacity:.55}fieldset[disabled] label{cursor:default}.quantity{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px 0}.quantity input{width:84px;font:inherit;padding:9px;border:1px solid var(--line);border-radius:9px;text-align:center}.summary h2{margin-bottom:10px}.summary textarea{width:100%;min-height:210px;resize:vertical;background:#faf7f8;border:1px solid var(--line);border-radius:12px;padding:12px;font:13px/1.65 inherit;font-family:inherit;font-size:13px;line-height:1.65;color:var(--ink)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));z-index:3}.bar{max-width:520px;margin:auto}.total{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.total strong{font-size:25px;color:var(--red);letter-spacing:-.8px}.buttons{display:flex;gap:8px}button,.chatlink{font:inherit;font-weight:700;border:0;border-radius:12px;min-height:48px;padding:12px;cursor:pointer;text-align:center;text-decoration:none;display:inline-flex;justify-content:center;align-items:center}.copy{background:#f4e9ed;color:var(--red);flex:0 0 88px}.share,.chatlink{background:#fee500;color:#211d00;flex:1}.status{font-size:12px;min-height:18px;margin:5px 0 0}.error{color:#a20f3c}.missing{outline:2px solid #c54768;outline-offset:2px}.manual{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.manual .chatlink{width:100%;margin-top:8px}[hidden]{display:none!important}button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}@media(max-width:360px){body{padding-left:9px;padding-right:9px}.opt{padding:11px 8px;gap:7px}.price{font-size:12px}.name{font-size:14px}.copy{flex-basis:72px}}
 .request{margin:10px 0 3px;padding:12px;background:#fff8fa;border:1px solid var(--line);border-radius:12px}.request label{display:block;font-size:13px;font-weight:700;color:var(--red);margin-bottom:7px}.request textarea{display:block;width:100%;min-height:72px;resize:vertical;border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px;font:inherit;font-size:16px;line-height:1.45;color:var(--ink)}.request textarea:focus{outline:2px solid #ad2e53;outline-offset:1px}.request textarea::placeholder{color:#9b8c92;font-size:14px}.summary textarea{min-height:300px}

<form id="form" novalidate><div id="groups"></div><section class="summary" id="summary"><h2>제작 견적 체크리스트</h2><textarea id="result" aria-label="견적 결과" readonly></textarea><div class="manual" id="manual" hidden><p>위 견적을 복사한 후 아래 링크로 상담창을 열어 붙여넣어 주세요. 새 창이 차단되면 일반 브라우저에서 이 페이지를 열어 주세요.</p><a class="chatlink" href="https://pf.kakao.com/_xjkSbG/chat" target="_blank" rel="noopener noreferrer">이비디자인 카카오톡 상담창 열기</a></div></section></form></main><footer class="bottom"><div class="bar"><div class="total"><span>예상 총금액</span><strong id="total" aria-live="polite">0원</strong></div><div class="buttons"><button class="copy" id="copy" type="button">결과 복사</button><a class="share chatlink" id="share" aria-describedby="share-guide" href="https://pf.kakao.com/_xjkSbG/chat" target="_blank" rel="noopener noreferrer">카카오톡으로 견적 보내기</a></div><p class="share-guide" id="share-guide">카카오톡 상담창 연결 후, 자동 복사된 내용을 붙여넣어 주세요.</p><p class="status" id="status" role="status">카카오톡 상담창에서 붙여넣기 후 전송해 주세요.</p></div></footer>
<script>
const CHAT='https://pf.kakao.com/_xjkSbG/chat';
const groups=[
{id:'base',title:'기본 제작 항목',hint:'제작할 기본 항목을 하나 선택해 주세요.',options:[['a','커스텀 A세트',65000],['b','커스텀 B세트',55000],['g','게이지 단독 제작',40000]]},
{id:'rank',title:'후원 랭킹 아이콘 추가',hint:'A세트 제작 시 선택 가능',options:[['r1','후원 랭킹 아이콘 1종 (기본 제공)',0],['r2','후원 랭킹 아이콘 2종',5000],['r3','후원 랭킹 아이콘 3종',10000]]},
{id:'tag',title:'상단 네임택',hint:'택 1',options:[['static','일반 이미지',15000],['gif','움직이는 이미지 (움짤)',25000],['no','추가하지 않음',0]]},
{id:'timer',title:'타이머 아이콘 추가',hint:'A·B세트 제작 시 선택 가능',options:[['yes','추가',10000],['no','추가하지 않음',0]]},
{id:'badge',title:'뱃지 아이콘 추가 (게이지, 공지 아이콘)',hint:'추가 시 수량을 입력해 주세요.',options:[['yes','추가',10000],['no','추가하지 않음',0]]},
{id:'effect',title:'게이지 주변 효과',hint:'택 1',options:[['yes','추가',10000],['no','추가하지 않음',0]]}
];
const $=id=>document.getElementById(id), won=n=>n.toLocaleString('ko-KR')+'원';
const requestOptions={rank:['r1'],tag:['static','gif'],timer:['yes'],badge:['yes'],effect:['yes']};
const requestField=(g,id)=>requestOptions[g.id]?.includes(id)?`<div class="request" id="request-${g.id}-${id}" hidden><label for="note-${g.id}-${id}">디자인 요청사항 :</label><textarea id="note-${g.id}-${id}" rows="2" placeholder="원하시는 디자인을 간단히 입력해 주세요." disabled></textarea></div>`:'';
$('groups').innerHTML=groups.map((g,i)=>`<fieldset id="f-${g.id}" aria-labelledby="h-${g.id}"><h2 id="h-${g.id}"><span>0${i+1}</span>${g.title}</h2><p class="hint" id="hint-${g.id}">${g.hint}</p>${g.options.map(([id,name,price])=>`<label class="opt"><input type="radio" name="${g.id}" value="${id}"${g.id==='rank'&&id==='r1'?' checked':''}><span class="name">${name}</span><span class="price">${g.id==='badge'&&id==='yes'?'개당 ':''}${won(price)}</span></label>${requestField(g,id)}`).join('')}${g.id==='badge'?'<div class="quantity" id="qtyWrap" hidden><label for="qty">뱃지 아이콘 수량 (개)</label><input type="number" id="qty" min="1" max="9999" step="1" inputmode="numeric" value="1"></div>':''}</fieldset>`).join('');
const selected=id=>document.querySelector(`input[name="${id}"]:checked`)?.value;
const applicable=(id,base)=>id==='rank'?base==='a':id==='timer'?base==='a'||base==='b':true;
function getQuote(){const base=selected('base');let total=0,missing=[],lines=[],requests=[];groups.forEach((g,i)=>{let desc='미선택',price=0;const enabled=applicable(g.id,base);const value=selected(g.id);if(!enabled){desc=base?'해당 없음':'기본 항목 선택 후 확인';}else if(!value){missing.push(g.id);}else{const opt=g.options.find(o=>o[0]===value);desc=opt[1];price=opt[2];if(g.id==='badge'&&value==='yes'){const n=Number($('qty').value);if(!Number.isInteger(n)||n<1||n>9999){missing.push('badge');desc='수량 미확정';price=0;}else{desc=`추가 (${n}개 × ${won(10000)})`;price*=n;}}}total+=price;lines.push(`0${i+1}. ${g.title}: ${desc} / ${won(price)}`);if(enabled&&requestOptions[g.id]?.includes(value)){const note=$(`note-${g.id}-${value}`).value.trim();if(note)requests.push(`• ${g.title} (${g.options.find(o=>o[0]===value)[1]})\n${note}`);}});return {total,missing,text:`[BABY DESIGN (이비디자인)]\nCSS 커스텀 제작 견적 체크리스트\n\n${lines.join('\n')}\n\n예상 총금액: ${won(total)}\n\n[디자인 요청사항]\n${requests.length?requests.join('\n\n'):'별도 요청사항 없음'}\n\n${missing.length?'※ 미선택 항목 있음':'선택한 옵션으로 견적 확인 부탁드립니다.'}`};}
function refresh(){const base=selected('base');for(const g of groups){const enabled=applicable(g.id,base);$('f-'+g.id).disabled=!enabled;if(!enabled&&g.id==='rank')document.querySelector('input[name="rank"][value="r1"]').checked=true;if(!enabled&&g.id==='timer')document.querySelectorAll('input[name="timer"]').forEach(x=>x.checked=false);$('hint-'+g.id).textContent=g.hint+(!enabled?' · 현재 선택 불가':'');}for(const [group,options] of Object.entries(requestOptions)){for(const option of options){const visible=applicable(group,base)&&selected(group)===option;$(`request-${group}-${option}`).hidden=!visible;$(`note-${group}-${option}`).disabled=!visible;}}$('qtyWrap').hidden=selected('badge')!=='yes';$('qty').disabled=$('qtyWrap').hidden;const q=getQuote();$('total').textContent=won(q.total);$('result').value=q.text;$('manual').hidden=true;groups.forEach(g=>$('f-'+g.id).classList.remove('missing'));$('status').textContent=q.missing.length?'아직 선택하지 않은 항목이 있습니다.':'모든 옵션이 선택되었습니다.';}
function validate(){const q=getQuote();if(q.missing.length){q.missing.forEach(id=>$('f-'+id).classList.add('missing'));$('status').textContent='누락된 옵션을 모두 선택해 주세요.';$('f-'+q.missing[0]).scrollIntoView({behavior:'smooth',block:'center'});return null;}return q;}
function copySync(){const el=$('result');const old=document.activeElement;el.focus({preventScroll:true});el.select();el.setSelectionRange(0,el.value.length);let ok=false;try{ok=document.execCommand('copy');}catch(e){}if(ok&&old&&old.focus)old.focus({preventScroll:true});return ok;}
async function copyAsync(text){if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(text);return true;}catch(e){}}return copySync();}
function showChatHelp(ok){$('manual').hidden=false;$('status').textContent=ok?'견적이 복사되었습니다. 카카오톡에서 붙여넣어 주세요.':'자동 복사 실패: 견적 내용을 직접 복사해 주세요.';if(!ok){$('summary').scrollIntoView({behavior:'smooth',block:'center'});$('result').focus({preventScroll:true});$('result').select();}}
$('form').addEventListener('input',refresh);
$('copy').addEventListener('click',async()=>{const q=validate();if(!q)return;const ok=copySync()||await copyAsync(q.text);showChatHelp(ok);});
$('share').addEventListener('click',e=>{const q=validate();if(!q){e.preventDefault();return;}if(copySync()){showChatHelp(true);return;}e.preventDefault();copyAsync(q.text).then(ok=>{showChatHelp(ok);if(ok){$('status').textContent='견적 복사 완료. 아래 상담창 열기 링크를 눌러 주세요.';$('manual').scrollIntoView({behavior:'smooth',block:'center'});}});});refresh();
</script></body></html>
